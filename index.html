  <style>
    :root {
      --primary: #0056b3;
      --primary-dark: #003d82;
      --secondary: #d32f2f;
      --accent: #0284c7;
      --dark-bg: #0b1329;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: var(--text);
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1260px; margin: 0 auto; padding: 0 20px; }

    /* TOPBAR */
    .topbar {
      background: var(--dark-bg);
      color: #94a3b8;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .topbar-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar-items span { margin-right: 20px; }
    .topbar-items i { color: #38bdf8; margin-right: 6px; }

    /* HEADER */
    header {
      background: #fff;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 99;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      background: linear-gradient(135deg, var(--primary), #0284c7);
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      padding: 7px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
    }
    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--dark-bg);
      letter-spacing: -0.3px;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* SEARCH BAR */
    .search-wrapper {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-wrapper input {
      width: 100%;
      padding: 10px 42px 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .search-wrapper input:focus { border-color: var(--primary); }
    .search-wrapper i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

      align-items: center;
